name: CI

# Quality gate. Runs on every push and every PR.
# All three gates are verified green locally at the time this file was added:
#   npm run typecheck  -> astro sync && tsc --noEmit && astro check
#   npm test           -> vitest (unit) + vitest --config vitest.workers.config.ts (workers integration)
#   npm run build      -> astro build
# The integration tests apply their own D1 migrations in-process (tests/integration/helpers.ts
# ensureMigrated()), so a fresh runner needs no external state or secrets.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + Cloudflare workers integration)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error
