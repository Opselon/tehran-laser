name: CD

# Deploys the built site to Cloudflare Workers (tehran-laser) — ONLY after CI is green.
#
# Gating: triggered by the CI workflow finishing (workflow_run), and the job is skipped
# unless that CI run concluded `success`, so a push to main cannot reach production while
# typecheck/tests/build are red. `workflow_dispatch` stays for a deliberate manual deploy.
#
# There is deliberately no paths-ignore here: skipping "docs-only" pushes needs a diff
# against the triggering commit, and getting that check wrong in the fail-closed direction
# would silently stop real deploys — deploying a docs-only change is harmless.
#
# REQUIRED REPOSITORY SECRET — the job degrades to a no-op notice if it is missing, so
# adding this file is safe before the secret exists:
#   CLOUDFLARE_API_TOKEN   (Worker Deploy:Edit on the account)
#   CLOUDFLARE_ACCOUNT_ID  (optional; needed only if the token spans several accounts)
#
# NOTE: remote D1 migrations are deliberately NOT run here. `npm run db:migrate:remote` changes
# the live database, so it must stay a deliberate human-triggered operation.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; never cancel a deploy already in flight.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only deploy when CI passed. Manual runs are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit CI validated (empty on a manual run -> current SHA).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set as a repository secret, so nothing was deployed. Add it under Settings -> Secrets and variables -> Actions."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Post-deploy verification: public routes render, health reports a live DB,
      # SEO endpoints exist, and the anonymous auth boundary holds. All checks are
      # read-only. Update SMOKE_BASE when the domain cutover lands
      # (docs/DOMAIN-CUTOVER.md §3 step 7).
      - name: Post-deploy smoke tests
        if: steps.creds.outputs.present == 'true'
        env:
          SMOKE_BASE: https://tehran-laser.opcelon.workers.dev
        run: |
          set -euo pipefail

          for path in / /services /booking /clinic /faq /blog /contact /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error title=Smoke failed::$path returned $code"; exit 1; }
          done

          health=$(curl -sf --max-time 20 "$SMOKE_BASE/api/health")
          echo "$health"
          echo "$health" | grep -q '"status":"ok"' \
            || { echo "::error title=Smoke failed::health check: $health"; exit 1; }

          for path in /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error title=Smoke failed::$path returned $code"; exit 1; }
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_BASE/api/v1/admin/dashboard")
          echo "/api/v1/admin/dashboard (anonymous) -> $code"
          [ "$code" = "401" ] || { echo "::error title=Smoke failed::anonymous admin API returned $code (expected 401)"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_BASE/admin")
          echo "/admin (anonymous) -> $code"
          [ "$code" = "302" ] || { echo "::error title=Smoke failed::anonymous /admin returned $code (expected 302 redirect to login)"; exit 1; }

          echo "All post-deploy smoke checks passed."

      - name: Report deployment
        if: steps.creds.outputs.present == 'true'
        run: echo "Deployed commit $(git rev-parse HEAD)"
